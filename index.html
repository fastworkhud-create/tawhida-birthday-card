<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tawhida Birthday</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Montserrat', sans-serif; cursor: pointer; }
        canvas { display: block; }

        #overlay {
            position: absolute;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            pointer-events: none;
            transition: 1s ease;
        }

        h1 { font-weight: 200; letter-spacing: 15px; text-transform: uppercase; margin: 0; font-size: 1.2rem; opacity: 0.6; }
        .bold-text { font-weight: 800; color: #ff2d55; display: none; font-size: 3rem; letter-spacing: 5px; }

        .hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #444;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="overlay">
        <h1 id="main-txt">The Universe is empty...</h1>
        <h1 id="love-txt" class="bold-text">Happy Birthday<br>Tawhida</h1>
    </div>
    <div class="hint">Click and Hold to create Gravity</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, particles;
        let isPressing = false;
        const particleCount = 12000;
        const positions = new Float32Array(particleCount * 3);
        const velocities = new Float32Array(particleCount * 3);
        const originals = new Float32Array(particleCount * 3);

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            
            for (let i = 0; i < particleCount; i++) {
                // Initial random space positions
                positions[i*3] = (Math.random() - 0.5) * 2000;
                positions[i*3+1] = (Math.random() - 0.5) * 2000;
                positions[i*3+2] = (Math.random() - 0.5) * 2000;

                // Velocities
                velocities[i*3] = (Math.random() - 0.5) * 2;
                velocities[i*3+1] = (Math.random() - 0.5) * 2;
                velocities[i*3+2] = (Math.random() - 0.5) * 2;

                // Heart Shape Targets (Pre-calculated)
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                
                originals[i*3] = x * 25;
                originals[i*3+1] = y * 25;
                originals[i*3+2] = (Math.random() - 0.5) * 200;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const mat = new THREE.PointsMaterial({
                size: 2,
                color: 0xffffff,
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geo, mat);
            scene.add(particles);

            window.addEventListener('mousedown', () => { isPressing = true; updateUI(true); });
            window.addEventListener('mouseup', () => { isPressing = false; updateUI(false); });
            window.addEventListener('touchstart', () => { isPressing = true; updateUI(true); });
            window.addEventListener('touchend', () => { isPressing = false; updateUI(false); });

            animate();
        }

        function updateUI(active) {
            const main = document.getElementById('main-txt');
            const love = document.getElementById('love-txt');
            if(active) {
                main.style.display = 'none';
                love.style.display = 'block';
                particles.material.color.setHex(0xff2d55);
            } else {
                main.style.display = 'block';
                love.style.display = 'none';
                particles.material.color.setHex(0xffffff);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const posAttr = particles.geometry.attributes.position;
            
            for (let i = 0; i < particleCount; i++) {
                let i3 = i * 3;
                
                if (isPressing) {
                    // Pull towards Heart Shape
                    posAttr.array[i3] += (originals[i3] - posAttr.array[i3]) * 0.08;
                    posAttr.array[i3+1] += (originals[i3+1] - posAttr.array[i3+1]) * 0.08;
                    posAttr.array[i3+2] += (originals[i3+2] - posAttr.array[i3+2]) * 0.08;
                } else {
                    // Drift in Space
                    posAttr.array[i3] += velocities[i3];
                    posAttr.array[i3+1] += velocities[i3+1];
                    posAttr.array[i3+2] += velocities[i3+2];
                    
                    // Boundary check
                    if (Math.abs(posAttr.array[i3]) > 1500) velocities[i3] *= -1;
                    if (Math.abs(posAttr.array[i3+1]) > 1500) velocities[i3+1] *= -1;
                }
            }

            posAttr.needsUpdate = true;
            particles.rotation.y += 0.005;
            renderer.render(scene, camera);
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
